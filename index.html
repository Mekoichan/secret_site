<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本丸管理系統</title>
    <style>
        :root {
            --win98-bg: #c0c0c0;
            --win98-btn: #c0c0c0;
            --win98-btn-highlight: #ffffff;
            --win98-btn-shadow: #808080;
            --win98-btn-dark: #404040;
            --win98-title: #000080;
            --win98-title-text: #ffffff;
            --win98-window-bg: #ffffff;
            --taskbar-bg: #c0c0c0;
            --desktop-bg: #3a6b5e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            background: #000;
        }

        /* ============ DESKTOP ============ */
        #desktop {
            width: 100vw;
            height: calc(100vh - 40px);
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.8s ease;
            overflow: hidden;
        }
        #desktop.wallpaper-default {
            background: linear-gradient(160deg, #4a7c6b 0%, #2d5a4b 25%, #5a8a6e 40%, #3a6b5e 55%, #6b9a7a 70%, #2a4a3a 100%),
                radial-gradient(ellipse at 30% 55%, rgba(180, 160, 120, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 35%, rgba(200, 180, 140, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 70%, rgba(140, 120, 80, 0.15) 0%, transparent 40%);
            background-color: #3a6b5e;
        }
        #desktop.wallpaper-sepia {
            background: linear-gradient(180deg, #c2a878 0%, #b8945c 20%, #d4c08a 40%, #a07840 60%, #c8b078 80%, #8a6830 100%),
                radial-gradient(ellipse at 40% 50%, rgba(60, 40, 20, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 55% 45%, rgba(80, 55, 25, 0.3) 0%, transparent 50%);
            background-color: #b8945c;
            filter: sepia(0.5) brightness(0.85);
        }
        #desktop.wallpaper-black {
            background: #0a0a0a !important;
            filter: none !important;
        }

        /* Desktop Icons Grid */
        #desktop-icons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            padding: 8px 6px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            font-size: 11px;
            letter-spacing: 0.5px;
            transition: background 0.1s;
            position: absolute;
            user-select: none;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .desktop-icon:active {
            background: rgba(255, 255, 255, 0.35);
        }
        .desktop-icon .icon-img {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 3px;
            pointer-events: none;
            filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.4));
        }
        .desktop-icon .icon-label {
            pointer-events: none;
            font-size: 10.5px;
            line-height: 1.2;
            word-break: break-all;
        }
        .desktop-icon.circular-layout {
            transition: all 2s ease;
        }

        /* ============ TASKBAR ============ */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            display: flex;
            align-items: center;
            padding: 0 4px;
            z-index: 1000;
            box-shadow: 0 -1px 0 #808080;
        }
        #start-btn {
            height: 30px;
            padding: 0 14px;
            font-weight: bold;
            font-size: 13px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            background: #c0c0c0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
            min-width: 55px;
            justify-content: center;
        }
        #start-btn:active,
        #start-btn.active {
            border-color: #808080 #fff #fff #808080;
            background: #b0b0b0;
        }
        #start-btn .start-icon {
            font-size: 16px;
        }
        #taskbar-windows {
            flex: 1;
            display: flex;
            gap: 3px;
            margin: 0 6px;
            overflow-x: auto;
            height: 30px;
            align-items: center;
        }
        .taskbar-window-item {
            height: 26px;
            padding: 0 12px;
            font-size: 11px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            background: #c0c0c0;
            cursor: pointer;
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
            line-height: 22px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            max-width: 160px;
        }
        .taskbar-window-item.active {
            border-color: #808080 #fff #fff #808080;
            background: #b0b0b0;
            font-weight: bold;
        }
        #taskbar-time {
            font-size: 11px;
            padding: 0 10px;
            white-space: nowrap;
            cursor: pointer;
            min-width: 70px;
            text-align: right;
            border-left: 1px solid #808080;
            height: 30px;
            line-height: 30px;
            letter-spacing: 0.3px;
        }
        #taskbar-time:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* ============ START MENU ============ */
        #start-menu {
            position: fixed;
            bottom: 40px;
            left: 2px;
            width: 220px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            z-index: 1001;
            display: none;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }
        #start-menu.show {
            display: block;
        }
        #start-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #d0d0d0;
            letter-spacing: 0.5px;
        }
        #start-menu .menu-item:hover {
            background: #000080;
            color: #fff;
        }
        #start-menu .menu-divider {
            height: 1px;
            background: #808080;
            margin: 3px 0;
            border-top: 1px solid #fff;
        }
        #start-menu .menu-item.shutdown {
            font-weight: bold;
            color: #600;
        }
        #start-menu .menu-item.shutdown:hover {
            background: #800;
            color: #fff;
        }

        /* ============ WINDOWS ============ */
        .window {
            position: absolute;
            min-width: 280px;
            min-height: 150px;
            background: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            z-index: 10;
            display: none;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
            resize: both;
            overflow: auto;
        }
        .window.active {
            z-index: 50;
        }
        .window .title-bar {
            background: #000080;
            color: #fff;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            cursor: move;
            letter-spacing: 0.5px;
            user-select: none;
        }
        .window .title-bar .title-text {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .window .title-bar .win-buttons {
            display: flex;
            gap: 2px;
        }
        .window .title-bar .win-btn {
            width: 20px;
            height: 20px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            font-size: 11px;
            line-height: 16px;
            text-align: center;
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .window .title-bar .win-btn:active {
            border-color: #808080 #fff #fff #808080;
        }
        .window .title-bar .win-btn.close-btn {
            font-size: 13px;
        }
        .window .window-content {
            padding: 12px;
            background: #fff;
            min-height: 60px;
            font-size: 12px;
            color: #000;
            line-height: 1.5;
            overflow: auto;
            max-height: calc(100vh - 200px);
        }
        .window-resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, #808080 50%);
        }
        /* 在现有 .window 样式后添加 */
@media (max-width: 768px) {
    .window {
        min-width: 260px;
        width: 90vw !important;
        left: 5vw !important;
        top: 80px !important;
        max-height: 70vh;
        resize: none; /* 移动端可禁用缩放，或保留但不强求 */
    }
    .window .window-content {
        max-height: 50vh;
        overflow: auto;
    }
    .window-resize-handle {
        display: none; /* 触摸屏缩放体验差，隐藏 */
    }
    .desktop-icon {
        width: 70px;
        font-size: 10px;
    }
    .desktop-icon .icon-img {
        width: 36px;
        height: 36px;
        font-size: 28px;
    }
    #taskbar-windows {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
    .taskbar-window-item {
        min-width: 60px;
        font-size: 10px;
    }
}
        /* ============ OVERLAY & MODALS ============ */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            display: none;
            pointer-events: all;
        }
        .black-screen {
            background: #000;
            z-index: 2000;
        }
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2001;
            display: none;
            pointer-events: none;
            background: #000;
            color: #fff;
            font-size: 24px;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            font-family: 'Times New Roman', serif;
        }
        .terminal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            z-index: 3000;
            display: none;
            color: #33ff33;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 15px;
            padding: 40px;
            flex-direction: column;
            overflow-y: auto;
            line-height: 1.7;
        }
        .terminal-overlay .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: #33ff33;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes shake {
    0% { transform: translate(1px, 1px); }
    25% { transform: translate(-1px, -2px); }
    50% { transform: translate(-2px, 1px); }
    75% { transform: translate(2px, -1px); }
    100% { transform: translate(1px, 1px); }
}
@keyframes pulse {
    0% { border-color: #8b0000; box-shadow: 0 0 0 0 rgba(139,0,0,0.5); }
    70% { border-color: #ff0000; box-shadow: 0 0 15px 5px rgba(255,0,0,0.6); }
    100% { border-color: #8b0000; box-shadow: 0 0 0 0 rgba(139,0,0,0); }
}
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .terminal-input-line input {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            caret-color: #33ff33;
            flex: 1;
            letter-spacing: 2px;
        }

        /* ============ GOV SITE STYLES ============ */
        .gov-site {
            font-family: 'Times New Roman', 'SimSun', '宋体', serif;
            background: #f5f5f0;
            color: #1a1a1a;
            padding: 20px 40px;
            min-height: 100%;
            letter-spacing: 0.5px;
        }
        .gov-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #8b0000;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .gov-header .gov-title {
            font-size: 28px;
            color: #8b0000;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .gov-header .hinomaru {
            width: 40px;
            height: 40px;
            background: #bc002d;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .gov-announcement-list {
            list-style: none;
        }
        .gov-announcement-item {
            border-bottom: 1px solid #ccc;
            padding: 14px 0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .gov-announcement-item:hover {
            background: #fdf5f5;
        }
        .gov-announcement-item .ann-title {
            font-size: 17px;
            color: #333;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .gov-announcement-item .ann-meta {
            font-size: 12px;
            color: #777;
            display: flex;
            gap: 20px;
        }
        .gov-announcement-item .ann-seal {
            color: #8b0000;
            font-weight: bold;
            border: 1px solid #8b0000;
            display: inline-block;
            padding: 1px 6px;
            font-size: 10px;
            letter-spacing: 2px;
            border-radius: 2px;
        }
        .hidden-red-text {
            color: #f5f5f0;
            transition: color 0.3s;
            user-select: text;
            cursor: text;
        }
        .hidden-red-text::selection {
            color: #8b0000;
            background: #ffe0e0;
        }
        .hidden-red-text:hover {
            color: #8b0000;
            cursor: text;
        }
        .gov-footer-note {
            font-size: 10px;
            color: #aaa;
            text-align: right;
            margin-top: 20px;
            font-style: italic;
            letter-spacing: 1px;
        }
        .gov-archive-link {
            font-size: 11px;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px;
            display: inline-block;
        }
        .gov-old-entry {
            font-size: 10px;
            color: #999;
            cursor: pointer;
            margin-top: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .gov-old-entry:hover {
            color: #555;
        }
        .gov-contact-form {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }
        .gov-contact-form textarea {
            width: 100%;
            height: 80px;
            font-family: inherit;
            font-size: 13px;
            padding: 8px;
            border: 1px solid #ccc;
            resize: vertical;
        }
        .gov-contact-form input[type="text"] {
            width: 100%;
            padding: 6px;
            font-family: inherit;
            border: 1px solid #ccc;
            margin-bottom: 8px;
        }
        .gov-contact-form .send-btn {
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 8px 24px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* ============ NOTIFICATION TOAST ============ */
        #notification-area {
            position: fixed;
            bottom: 50px;
            right: 15px;
            z-index: 1500;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            pointer-events: none;
        }
        .notification-toast {
            background: #ffffe0;
            border: 2px solid #808080;
            padding: 10px 14px;
            font-size: 11px;
            max-width: 280px;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            animation: slideIn 0.4s ease;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', sans-serif;
        }
        .notification-toast .notif-avatar {
            width: 36px;
            height: 36px;
            background: #2a1a3a;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #c8a0ff;
        }
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============ CMD WINDOW ============ */
        .cmd-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            background: #000;
            color: #c0c0c0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 20px;
            z-index: 2500;
            border: 2px solid #555;
            display: none;
            line-height: 1.6;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2800;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #f5f5f0;
            border: 4px solid #8b0000;
            padding: 30px;
            max-width: 500px;
            text-align: center;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            letter-spacing: 1px;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.4);
        }
        .modal-box .modal-btn {
            margin-top: 15px;
            padding: 8px 24px;
            background: #8b0000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ============ FINAL MODAL (permanent) ============ */
        #permanent-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }
        #permanent-modal .perm-modal-content {
            background: #111;
            border: 3px solid #8b0000;
            padding: 40px;
            text-align: center;
            color: #ccc;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
            letter-spacing: 2px;
            max-width: 550px;
            box-shadow: 0 0 60px rgba(139, 0, 0, 0.5);
        }

        /* ============ MISC ============ */
        .context-menu {
            position: fixed;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            z-index: 1900;
            display: none;
            min-width: 160px;
            font-size: 12px;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }
        .context-menu .ctx-item {
            padding: 6px 16px;
            cursor: pointer;
            border-bottom: 1px solid #d0d0d0;
        }
        .context-menu .ctx-item:hover {
            background: #000080;
            color: #fff;
        }
        .context-menu .ctx-item.disabled {
            color: #999;
            cursor: not-allowed;
            pointer-events: none;
        }
        .dragging {
            opacity: 0.7;
            z-index: 100 !important;
        }
        input[type="password"].terminal-pw {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            outline: none;
            letter-spacing: 3px;
            width: 120px;
        }
    </style>
</head>
<body>

    <!-- ==================== DESKTOP ==================== -->
    <div id="desktop" class="wallpaper-default">
        <div id="desktop-icons">
            <!-- Icons positioned via JS -->
        </div>
    </div>

    <!-- ==================== TASKBAR ==================== -->
    <div id="taskbar">
        <button id="start-btn"><span class="start-icon">🔴</span> 开始</button>
        <div id="taskbar-windows"></div>
        <div id="taskbar-time">00:00</div>
    </div>

    <!-- ==================== START MENU ==================== -->
    <div id="start-menu">
        <div class="menu-item" data-action="gov-site">📋 时政公告</div>
        <div class="menu-item" data-action="memo">📝 私人备忘录</div>
        <div class="menu-item" data-action="mail">📧 时政邮件</div>
        <div class="menu-item" data-action="mycomputer">💻 我的电脑</div>
        <div class="menu-divider"></div>
        <div class="menu-item shutdown" data-action="shutdown">⏻ 关机</div>
    </div>

    <!-- ==================== CONTEXT MENU ==================== -->
    <div class="context-menu" id="desktop-context-menu">
        <div class="ctx-item" data-action="refresh">重新整理</div>
        <div class="ctx-item" data-action="personalize" id="ctx-personalize">个人化</div>
    </div>

    <!-- ==================== NOTIFICATION AREA ==================== -->
    <div id="notification-area"></div>

    <!-- ==================== FULLSCREEN OVERLAYS ==================== -->
    <div class="fullscreen-overlay black-screen" id="black-overlay"></div>
    <div class="flash-overlay" id="flash-overlay"></div>
    <div class="cmd-window" id="cmd-window"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box"></div>
    </div>
    <div class="terminal-overlay" id="terminal-overlay"></div>
    <div id="permanent-modal">
        <div class="perm-modal-content" id="perm-modal-content"></div>
    </div>

    <!-- ==================== WINDOW TEMPLATES (created by JS) ==================== -->

            function showTooltipNear(el, text) {
                const existing = document.querySelector('.custom-tooltip');
                if (existing) existing.remove();
                const tip = document.createElement('div');
                tip.className = 'custom-tooltip';
                tip.textContent = text;
                tip.style.cssText = `
              position:fixed;background:#ffffcc;border:1px solid #888;padding:4px 10px;font-size:11px;
              z-index:3000;pointer-events:none;white-space:nowrap;box-shadow:2px 2px 4px rgba(0,0,0,0.3);
            `;
                document.body.appendChild(tip);
                const rect = el.getBoundingClientRect();
                tip.style.left = rect.left + 'px';
                tip.style.top = (rect.bottom + 5) + 'px';
                el.addEventListener('mouseleave', () => { tip.remove(); }, { once: true });
            }

saveBtn.addEventListener('click', () => {

    if (val === '') return;

    // 定义触发关键词
    const triggerKeywords = ['回家', '离开', '返回现世', '我想回家', '逃', '回去'];
    const isTrigger = triggerKeywords.some(kw => val.includes(kw));
    const likeText = '最喜欢长谷部了';
    const likeTextTraditional = '最喜歡長谷部了';

    // 优先处理触发关键词：插入隐藏记录，保存用户原话，不进行篡改
    if (isTrigger && !STATE.memoPwdHintTriggered) {
        const hiddenRecord = '我已经记不清这是第几天了……\n长谷部一直在监视我,\n那个……密码是他的daozxncjksdhuw';
        STATE.memoEntries.push(hiddenRecord);
        STATE.memoPwdHintTriggered = true;
        saveState();
        // 同时保存用户输入的原始内容（作为一条新记录）
        saveState();
        textarea.value = '';
        selectedMemoIndex = -1;
        renderMemoContent(content);
        showNotification('您发现了不得了的东西呢。');
        return;  // 不再执行后续逻辑
    }

    // 处理“最喜欢长谷部了”的特殊情况
    if (val === likeText || val === likeTextTraditional) {
        if (selectedMemoIndex >= 0 && selectedMemoIndex < STATE.memoEntries.length) {
            STATE.memoEntries[selectedMemoIndex] = val;
        } else {
            STATE.memoEntries.push(val);
        }
        saveState();
        textarea.value = '';
        selectedMemoIndex = -1;
        renderMemoContent(content);
        showNotification('什…什么？！您…您竟然……！不，这不可能…！');
        return;
    }

    // 其他所有内容：强制改为“最喜歡長谷部了。”
    const forcedText = '最喜欢长谷部了。';
    if (selectedMemoIndex >= 0 && selectedMemoIndex < STATE.memoEntries.length) {

function showTerminalInput(mode) {
    const inputLine = document.getElementById('terminal-input-line');
    if (!inputLine) return;
    inputLine.innerHTML = '';

    // 根据模式显示不同的提示文字
    let promptText = '';
    if (mode === 'password') promptText = '密码> ';
    else if (mode === 'username') promptText = '用户名> ';
    else if (mode === 'command') promptText = '> ';
    else if (mode === 'saniwa-retry') promptText = '是否重试？(Y/N) > ';
    else promptText = '> ';

    const prompt = document.createElement('span');
    prompt.textContent = promptText;
    prompt.style.color = '#33ff33';
    inputLine.appendChild(prompt);

    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.style.cssText =
        'background:transparent;border:none;color:#33ff33;font-family:inherit;font-size:inherit;outline:none;caret-color:#33ff33;flex:1;letter-spacing:2px;';

    if (mode === 'password') {
        let realPassword = '';
        input.addEventListener('input', (e) => {
            const newValue = e.target.value;
            if (newValue.length > realPassword.length) {
                const added = newValue.slice(realPassword.length);
                realPassword += added;
            } else if (newValue.length < realPassword.length) {
                realPassword = realPassword.slice(0, newValue.length);
            }
            input.value = '*'.repeat(realPassword.length);
            input.dataset.real = realPassword;
            input.selectionStart = input.selectionEnd = input.value.length;
        });
        input.value = '';
        input.dataset.real = '';
    }

    inputLine.appendChild(input);
    input.focus();

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            input.disabled = true;
            let val;
            if (mode === 'password') {
                val = input.dataset.real || '';
            } else {
                val = input.value.trim();
            }
            handleTerminalInput(mode, val);
        }
    });
}

    // 4. 隐藏永久模态框（如果有）
    permanentModal.style.display = 'none';

    // 5. 全屏黑色覆盖层（确保任何窗口都被遮住）
    const existingOverlay = document.getElementById('permanent-black-overlay');
    if (existingOverlay) existingOverlay.remove();

    const blackOverlayLayer = document.createElement('div');
    blackOverlayLayer.id = 'permanent-black-overlay';
    blackOverlayLayer.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000000;
        z-index: 10000;
        pointer-events: all;
    `;
    document.body.appendChild(blackOverlayLayer);

    // 6. 禁用开始菜单按钮
    startBtn.style.pointerEvents = 'none';
    startBtn.style.opacity = '0.5';

    // 7. 显示一个简单提示
    showNotification('系統已锁定。');
 setTimeout(() => {
        alert("结局一：他发现你了");
        resetAllData();
    }, 2000);
    // ========== 新增：连续点击5次重置 ==========
    let clickCount = 0;
    let clickTimer = null;
    blackOverlayLayer.style.cursor = 'default';
    blackOverlayLayer.addEventListener('click', (e) => {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 800);
        if (clickCount >= 5) {
            resetAllData();      // 重置所有数据
            // resetAllData 会移除覆盖层，但为了保险再手动移除一次
            if (blackOverlayLayer.parentNode) blackOverlayLayer.remove();
            clickCount = 0;
        }
    });
}
            // ============ TASKBAR CLOCK ============
            function updateTaskbarClock() {
                const now = new Date();
                if (STATE.timeReset) {
                    taskbarTime.textContent = '00:00  |  1月1日 本丸元年';
                } else {
                    const h = String(now.getHours()).padStart(2, '0');
                    const m = String(now.getMinutes()).padStart(2, '0');
                    taskbarTime.textContent = h + ':' + m;
                }
            }
            setInterval(updateTaskbarClock, 1000);
            updateTaskbarClock();

            // Taskbar time click for reset (10 clicks)
            taskbarTime.addEventListener('click', () => {
                taskbarTimeClickCount++;
                clearTimeout(taskbarTimeClickTimer);
                taskbarTimeClickTimer = setTimeout(() => { taskbarTimeClickCount = 0; }, 2000);
                if (taskbarTimeClickCount >= 10) {
                    resetAllData();
                    taskbarTimeClickCount = 0;
                }
            });

            // Ctrl+Shift+R reset
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                    e.preventDefault();
                    resetAllData();
                }
            });
function resetAllData() {
    localStorage.clear();
    sessionStorage.clear();
    
    // 重置 STATE 中的所有标志
    STATE.shutdownCount = 0;
    STATE.wallpaperType = 'default';
    STATE.timeReset = false;
    STATE.memoEntries = [];
    STATE.permanentLocked = false;
    STATE.saniwaTriggered = false;
    STATE.contextMenuPersonalizeDisabled = false;
    STATE.userFeedbackName = '';
    STATE.honmaruChecklist = [false, false, false, false, false, false, false, false, false, false, false, false];
    STATE.mailHelpSeen = false;
    STATE.mailSenderSeen = false;
    STATE.loveMemoDeleteAttempts = 0;
    STATE.returnHomeAttempts = 0;
    STATE.hideReturnHome = false;
    STATE.memoPwdHintTriggered = false;
    STATE.terminalHelpCommandUsed = false;
    STATE.terminalHelpSecondConfirmed = false;
    STATE.oldUserClickCount = 0;
    STATE.goodEndingUnlocked = false;
    STATE.pseudoPlaygroundActive = false;
    
    saveState();  // 保存重置后的状态
    
    // 界面重置
    applyWallpaper();
    renderDesktopIcons();
    updateTaskbarClock();
    permanentModal.style.display = 'none';
    terminalOverlay.style.display = 'none';
    blackOverlay.style.display = 'none';
    flashOverlay.style.display = 'none';
    cmdWindow.style.display = 'none';
    hideModal();
    document.querySelectorAll('.window').forEach(w => w.remove());
    updateTaskbarWindows();
    if (floodInterval) clearInterval(floodInterval);
    
    // 恢复原始函数（如果有备份）
    if (typeof originalOpenGovSiteWindow !== 'undefined') {
        window.openGovSiteWindow = originalOpenGovSiteWindow;
        window.openMailWindow = originalOpenMailWindow;
        window.openMemoWindow = originalOpenMemoWindow;
    }
    
    showNotification('系统已重置。');
}

            // ============ PERIODIC RANDOM FILE ============
            function maybeSpawnRandomFile() {
                if (STATE.permanentLocked) return;
                if (Math.random() < 0.08 && !document.getElementById('window-random-temp')) {
                    const win = createWindow('random-temp', '不要相信他.txt', 300, 200,
                        Math.random() * 400 + 100, Math.random() * 300 + 50);
                    const content = document.getElementById('content-random-temp');
                    content.innerHTML = '<p style="color:#999;">（空白文件）</p>';
                    bringToFront(win);
                    showNotification('文件已清理。');
                    setTimeout(() => {
                        closeWindow('random-temp');
                    }, 4000 + Math.random() * 3000);
                }
            }
            setInterval(maybeSpawnRandomFile, 15000);

            // ============ INIT ============
           function init() {
    renderDesktopIcons();
    updateTaskbarClock();
    
    // 永久锁定状态：直接调用黑屏锁定（不会出现任何弹窗或圆形图标）
    if (STATE.permanentLocked) {
        applyPermanentLockdown();
    } 
    // 兼容旧存档：如果触发了 saniwa 但未锁定，也执行锁定
    else if (STATE.saniwaTriggered && !STATE.permanentLocked) {
        STATE.permanentLocked = true;
        STATE.wallpaperType = 'black';
        saveState();
        applyPermanentLockdown();
    }
    
    // 关机申请表单图标显示条件保持不变
    if (sessionStorage.getItem('showShutdownForm') === 'true' && STATE.shutdownCount >= 4) {
        renderDesktopIcons();
    }
}

            init();
            console.log('時之政府本丸管理系統已啟動。');
            console.log('压切长谷部正在為您服務。');
        })();
